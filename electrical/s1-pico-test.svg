0 425 L900 465" stroke="#102b40" stroke-width="3" fill="none"/><text x="930" y="450">SW1 normally open</text><path d="M880,480 L880,500" fill="none" stroke="#102b40" stroke-width="3"/><path d="M880,500 L880,515" fill="none" stroke="#102b40" stroke-width="3"/><path d="M862,515 L898,515" fill="none" stroke="#102b40" stroke-width="3"/><path d="M868,523 L892,523" fill="none" stroke="#102b40" stroke-width="3"/><path d="M875,531 L885,531" fill="none" stroke="#102b40" stroke-width="3"/><path d="M260,415 L320,415" fill="none" stroke="#102b40" stroke-width="3"/><path d="M320,415 L320,430" fill="none" stroke="#102b40" stroke-width="3"/><path d="M302,430 L338,430" fill="none" stroke="#102b40" stroke-width="3"/><path d="M308,438 L332,438" fill="none" stroke="#102b40" stroke-width="3"/><path d="M315,446 L325,446" fill="none" stroke="#102b40" stroke-width="3"/><text x="45" y="580">U1 power and USB data: use its built-in micro-USB socket and a standard data cable.</text><text x="45" y="620">LED: anode left; cathode at the bar. Button input: HIGH idle / LOW pressed.</text><text x="45" y="660">GP0 output low at startup. GP1 input; external R2 pull-up. Debounce in firmware.</text><text x="45" y="705">GPIO names, not header pin numbers. Prototype schematic — not yet physically tested.</text></g></svg>