<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#102b40"><text x="30" y="40">ModuDeck — S3: first-prototype power and data wiring</text><rect x="40" y="100" width="270" height="65" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="52" y="130">PSU1: Pi4 5.1 V / 3 A</text><path d="M310,132 L450,132" fill="none" stroke="#102b40" stroke-width="3"/><text x="325" y="110">USB-C</text><rect x="450" y="100" width="285" height="65" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="462" y="130">U1 Raspberry Pi 4</text><rect x="40" y="270" width="270" height="65" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="52" y="300">PSU2: display-specific</text><path d="M310,302 L450,302" fill="none" stroke="#102b40" stroke-width="3"/><text x="315" y="278">Documented input</text><rect x="450" y="270" width="285" height="65" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="462" y="300">U2 HDMI display</text><path d="M590,165 L590,270" fill="none" stroke="#102b40" stroke-width="3"/><text x="610" y="220">HDMI video</text><rect x="40" y="460" width="270" height="65" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="52" y="490">PSU3: hub-specific</text><path d="M310,492 L450,492" fill="none" stroke="#102b40" stroke-width="3"/><rect x="450" y="460" width="285" height="65" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="462" y="490">U3 self-powered USB hub</text><path d="M735,132 L800,132" fill="none" stroke="#102b40" stroke-width="3"/><path d="M800,132 L800,492" fill="none" stroke="#102b40" stroke-width="3"/><path d="M800,492 L735,492" fill="none" stroke="#102b40" stroke-width="3"/><text x="815" y="310">USB upstream</text><text x="760" y="365">No VBUS backfeed</text><rect x="900" y="460" width="265" height="65" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="912" y="490">3 reserved tray USB ports</text><path d="M735,510 L850,550" fill="none" stroke="#102b40" stroke-width="3"/><path d="M850,550 L1030,550" fill="none" stroke="#102b40" stroke-width="3"/><path d="M1030,550 L1030,525" fill="none" stroke="#102b40" stroke-width="3"/><text x="40" y="605">Keyboard and separate touchpad: Pi USB ports. Display USB touch: optional hub port.</text><text x="40" y="645">Positive outputs of PSU1 / PSU2 / PSU3 are NOT connected together.</text><text x="40" y="685">Hub must prevent upstream power backfeed. Display power/USB behavior must be verified.</text><text x="40" y="725">External complete supplies only. Final display/hub models and connector polarities TBD.</text></g></svg>