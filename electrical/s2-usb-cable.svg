<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#102b40"><text x="30" y="40">ModuDeck — S2: USB 2.0 cable pin mapping / reference</text><rect x="70" y="140" width="270" height="400" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="82" y="170">J1 USB-A: host/hub</text><rect x="850" y="140" width="285" height="400" fill="#f0f6fa" stroke="#102b40" stroke-width="2"/><text x="862" y="170">J2 Micro-B: Pico/device</text><text x="90" y="218">1 VBUS (+5 V)</text><path d="M340,230 L850,230" fill="none" stroke="#102b40" stroke-width="3"/><text x="870" y="218">1 VBUS</text><text x="90" y="298">2 D−</text><path d="M340,310 L850,310" fill="none" stroke="#102b40" stroke-width="3"/><text x="870" y="298">2 D−</text><text x="90" y="378">3 D+</text><path d="M340,390 L850,390" fill="none" stroke="#102b40" stroke-width="3"/><text x="870" y="378">3 D+</text><text x="90" y="458">4 GND</text><path d="M340,470 L850,470" fill="none" stroke="#102b40" stroke-width="3"/><text x="870" y="458">5 GND</text><text x="870" y="515">4 ID: not connected</text><text x="40" y="600">Use a factory-made shielded USB data cable; D+ and D− remain a twisted pair.</text><text x="40" y="640">This mapping documents the cable, not a custom PCB. Connector footprints vary.</text><text x="40" y="680">VBUS is supplied by the host/hub; no external supply injected on this device cable.</text></g></svg>