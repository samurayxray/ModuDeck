<!doctype html><html lang="it"><meta charset="utf-8"><title>ModuDeck 3D</title><style>body{margin:0;background:#091e31;color:white;font:16px system-ui}header{position:absolute;z-index:1;max-width:550px;padding:16px;background:#091e31dd}select,button{padding:10px;font-size:16px;margin:6px}canvas{display:block;width:100vw;height:100vh;touch-action:none}small{color:#9fc6d8}</style><header><b>ModuDeck — tutte le parti in 3D</b><br><select id="part"></select><button id="reset">Ripristina vista</button><p id="role"></p><small>Trascina per ruotare · rotella per zoom<br>CONCEPT — misure provvisorie</small></header><canvas id="c"></canvas><script>
const models=__MODELS__,meta=__META__,c=document.getElementById('c'),ctx=c.getContext('2d'),sel=document.getElementById('part');
let mode='exploded',rx=-.55,ry=.65,zoom=1,center,span;
for(const id in meta){const o=document.createElement('option');o.value=id;o.textContent=meta[id].name;sel.append(o)}sel.value=mode;
function setup(){const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const face of models[mode])for(const v of face)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],v[i]);hi[i]=Math.max(hi[i],v[i]);}center=lo.map((x,i)=>(x+hi[i])/2);span=Math.max(...hi.map((x,i)=>x-lo[i]))||1;document.getElementById('role').textContent=meta[mode].role;draw();}
function draw(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.fillStyle='#091e31';ctx.fillRect(0,0,innerWidth,innerHeight);
const sc=Math.min(innerWidth*.72,innerHeight*.62)/span*zoom;
function tr(v){let x=v[0]-center[0],y=v[1]-center[1],z=v[2]-center[2],a=x*Math.cos(ry)-y*Math.sin(ry),b=x*Math.sin(ry)+y*Math.cos(ry);return[a,b*Math.sin(rx)+z*Math.cos(rx),b*Math.cos(rx)-z*Math.sin(rx)];}
const fs=models[mode].map(f=>{let a=f.map(tr);return{a,d:a.reduce((s,v)=>s+v[2],0)/3};}).sort((a,b)=>a.d-b.d);
for(const f of fs){let a=f.a,u=a[1].map((v,i)=>v-a[0][i]),v=a[2].map((v,i)=>v-a[0][i]),n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1,light=.45+.55*Math.abs((n[0]*.3+n[1]*.6+n[2]*.7)/len);ctx.beginPath();a.forEach((v,i)=>{let x=innerWidth/2+v[0]*sc,y=innerHeight*.58-v[1]*sc;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fillStyle='rgb('+45*light+','+115*light+','+150*light+')';ctx.fill();ctx.strokeStyle='#79a4ba';ctx.lineWidth=.15;ctx.stroke();}}
let last;c.onpointerdown=e=>{last=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId);};c.onpointermove=e=>{if(!last)return;ry+=(e.clientX-last[0])*.008;rx+=(e.clientY-last[1])*.008;last=[e.clientX,e.clientY];draw();};c.onpointerup=c.onpointercancel=()=>last=null;c.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*Math.exp(-e.deltaY*.001)));draw();};sel.onchange=()=>{mode=sel.value;zoom=1;setup();};document.getElementById('reset').onclick=()=>{rx=-.55;ry=.65;zoom=1;draw();};onresize=draw;setup();
</script></html>
